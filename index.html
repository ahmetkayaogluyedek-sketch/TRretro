<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRRetro - 50 Oyunlu Retro Arcade Merkezi</title>
  <style>
    :root {
      --bg: #070913;
      --panel: #11162a;
      --panel-2: #18203d;
      --neon-cyan: #00f5d4;
      --neon-pink: #ff2a85;
      --neon-yellow: #ffd166;
      --neon-purple: #9b5de5;
      --text: #eef2ff;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #151c38 0%, var(--bg) 65%);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
    }

    header.trretro-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(10, 14, 28, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .made-by {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--neon-yellow);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-yellow));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    button, input {
      font-family: inherit;
    }

    .btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .btn:hover {
      border-color: var(--neon-cyan);
      background: #222d54;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-cyan {
      background: rgba(0, 245, 212, 0.14);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .btn-pink {
      background: rgba(255, 42, 133, 0.16);
      border-color: var(--neon-pink);
      color: #ff85b8;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 18px;
    }

    @media (max-width: 920px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .hud {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: #0b0f1f;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .hud-item {
      font-size: 13px;
      color: var(--muted);
    }

    .hud-item strong {
      color: var(--text);
      font-size: 14px;
    }

    .crt-wrap {
      position: relative;
      background: #05070f;
      border: 3px solid #2b355c;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .crt-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.28) 50%
      );
      background-size: 100% 4px;
      display: none;
    }

    .crt-enabled .crt-overlay {
      display: block;
    }

    .controls-bar {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 44px);
      gap: 6px;
    }

    .dpad .empty {
      visibility: hidden;
    }

    .action-keys {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .side-section + .side-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .side-section h3 {
      margin: 0 0 10px;
      font-size: 15px;
      color: var(--neon-cyan);
    }

    .player-row {
      display: flex;
      gap: 8px;
    }

    .player-row input {
      flex: 1;
      background: #0b0f1f;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 13px;
    }

    .leaderboard-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }

    .leaderboard-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b0f1f;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 13px;
    }

    .catalog-card {
      grid-column: 1 / -1;
    }

    .catalog-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .search-input {
      min-width: 220px;
      background: #0b0f1f;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 13px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
      gap: 10px;
      max-height: 460px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .game-item {
      background: #0b0f1f;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .game-item:hover {
      border-color: var(--neon-cyan);
    }

    .game-item.active {
      border-color: var(--neon-pink);
      background: rgba(255, 42, 133, 0.12);
    }

    .game-num {
      font-size: 11px;
      color: var(--neon-yellow);
      font-weight: 800;
    }

    .game-name {
      font-size: 14px;
      font-weight: 700;
    }

    .game-cat {
      font-size: 11px;
      color: var(--muted);
    }

    #retroToast {
      position: fixed;
      top: 72px;
      right: 18px;
      z-index: 60;
      pointer-events: none;
      max-width: 320px;
      background: #141b36;
      border: 1px solid var(--neon-cyan);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      transform: translateX(140%);
      transition: transform 0.25s ease;
    }

    #retroToast.toast-visible {
      transform: translateX(0);
    }

    #retroToast strong {
      display: block;
      font-size: 12px;
      color: var(--neon-cyan);
      margin-bottom: 2px;
    }

    #retroToast span {
      font-size: 13px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <header class="trretro-header">
    <div class="brand-group">
      <span class="made-by">MADE BY MUHSIN</span>
      <div class="brand-title">TRRETRO</div>
    </div>

    <div class="header-actions">
      <button type="button" class="btn btn-cyan" id="coinBtn">🪙 Jeton At</button>
      <button type="button" class="btn" id="crtBtn">📺 CRT: AÇIK</button>
      <button type="button" class="btn" id="soundBtn">🔊 Ses: AÇIK</button>
      <button type="button" class="btn btn-pink" id="startBtn">▶ Başlat / Yeniden</button>
    </div>
  </header>

  <main class="container">
    <section class="card" id="oyun-kabini">
      <div class="hud">
        <div class="hud-item">Oyun: <strong id="activeGameTitle">Süper Yılan</strong></div>
        <div class="hud-item">Skor: <strong id="scoreVal">0</strong></div>
        <div class="hud-item">En İyi: <strong id="bestVal">0</strong></div>
        <div class="hud-item">Jeton: <strong id="coinCount">3</strong></div>
      </div>

      <div class="crt-wrap crt-enabled" id="crtBox">
        <canvas id="gameCanvas" width="640" height="480"></canvas>
        <div class="crt-overlay"></div>
      </div>

      <div class="controls-bar">
        <div class="dpad" aria-label="Yön Tuşları">
          <span class="empty"></span>
          <button type="button" class="btn" data-dir="up">▲</button>
          <span class="empty"></span>
          <button type="button" class="btn" data-dir="left">◀</button>
          <button type="button" class="btn" data-dir="down">▼</button>
          <button type="button" class="btn" data-dir="right">▶</button>
        </div>

        <div class="action-keys">
          <button type="button" class="btn btn-cyan" id="actionBtn">⚡ Aksiyon / Ateş</button>
          <button type="button" class="btn" id="extraModeBtn" style="display:none;">Mod Değiştir</button>
        </div>
      </div>

      <div class="hint" id="controlHint">
        Klavye: Yön Tuşları / WASD ile hareket, Boşluk ile aksiyon.
      </div>
    </section>

    <aside class="card">
      <div class="side-section">
        <h3>Oyuncu Rumuzu</h3>
        <div class="player-row">
          <input type="text" id="playerNameInput" maxlength="12" placeholder="Rumuzun (ör. MUHSIN)" />
          <button type="button" class="btn btn-cyan" id="saveNameBtn">Kaydet</button>
        </div>
      </div>

      <div class="side-section">
        <h3>Bu Oyun İçin Rekorlar</h3>
        <ul class="leaderboard-list" id="leaderboardList"></ul>
        <div style="margin-top: 10px;">
          <button type="button" class="btn" id="resetScoresBtn">Rekorları Sıfırla</button>
        </div>
      </div>
    </aside>

    <section class="card catalog-card">
      <div class="catalog-top">
        <div class="filters" id="categoryFilters">
          <button type="button" class="btn btn-cyan" data-cat="Tümü">Tümü (50)</button>
          <button type="button" class="btn" data-cat="Arcade">Arcade</button>
          <button type="button" class="btn" data-cat="Aksiyon">Aksiyon</button>
          <button type="button" class="btn" data-cat="Bulmaca">Bulmaca</button>
          <button type="button" class="btn" data-cat="Refleks">Refleks</button>
        </div>
        <input type="search" class="search-input" id="gameSearch" placeholder="50 oyun içinde ara..." />
      </div>

      <div class="game-grid" id="gameGrid"></div>
    </section>
  </main>

  <div id="retroToast">
    <strong id="toastTitle">TRRETRO</strong>
    <span id="toastMessage">Hazır!</span>
  </div>

  <script>
    const GAMES = [
      { id: "snake", name: "Süper Yılan", cat: "Arcade" },
      { id: "invaders", name: "Uzay İstilacıları", cat: "Aksiyon" },
      { id: "breakout", name: "Neon Tuğla Kırma", cat: "Arcade" },
      { id: "xox", name: "Neon XOX", cat: "Bulmaca" },
      { id: "memory", name: "Hafıza Kartı", cat: "Bulmaca" },
      { id: "pong", name: "Retro Pong Tenis", cat: "Arcade" },
      { id: "mines", name: "Mayın Tarlası", cat: "Bulmaca" },
      { id: "dodge", name: "Meteor Kaçışı", cat: "Refleks" },
      { id: "clicker", name: "Turbo Tıklama", cat: "Refleks" },
      { id: "simon", name: "Renk Hafızası", cat: "Refleks" },
      { id: "flappy", name: "Kanatlı Kuş", cat: "Arcade" },
      { id: "catcher", name: "Yıldız Toplayıcı", cat: "Arcade" },
      { id: "shooter_x", name: "Galaksi Avcısı", cat: "Aksiyon" },
      { id: "maze_dash", name: "Labirent Koşusu", cat: "Bulmaca" },
      { id: "reflex_box", name: "Hızlı Refleks", cat: "Refleks" }
    ];

    const EXTRA_TITLES = [
      ["cyber_jump", "Siber Zıplama", "Arcade"],
      ["laser_grid", "Lazer Izgara", "Aksiyon"],
      ["pixel_golf", "Piksel Golf", "Bulmaca"],
      ["turbo_lane", "Otoban Yarışı", "Refleks"],
      ["star_guard", "Yıldız Kalkanı", "Aksiyon"],
      ["tile_flip", "Karo Çevirme", "Bulmaca"],
      ["nova_blast", "Nova Patlaması", "Aksiyon"],
      ["aim_pulse", "Hedef Vuruşu", "Refleks"],
      ["coin_rush", "Altın Avı", "Arcade"],
      ["wall_hop", "Duvar Sekmesi", "Refleks"],
      ["orbit_ship", "Yörünge Gemisi", "Aksiyon"],
      ["logic_pair", "Mantık Eşleştirme", "Bulmaca"],
      ["dash_runner", "Atılgan Koşucu", "Refleks"],
      ["crystal_hit", "Kristal Kırıcı", "Arcade"],
      ["shadow_evade", "Gölge Kaçış", "Aksiyon"],
      ["number_pop", "Sayı Patlatma", "Bulmaca"],
      ["sonic_tap", "Sonik Dokunuş", "Refleks"],
      ["moon_lander", "Ay İnişi", "Arcade"],
      ["plasma_wave", "Plazma Dalgası", "Aksiyon"],
      ["grid_lock", "Izgara Kilidi", "Bulmaca"],
      ["speed_gate", "Hız Kapısı", "Refleks"],
      ["alien_swarm", "Uzay Sürüsü", "Aksiyon"],
      ["mega_pong", "Mega Tenis", "Arcade"],
      ["flash_match", "Flaş Eşleşme", "Refleks"],
      ["prism_break", "Prizma Kırma", "Arcade"],
      ["rocket_lane", "Roket Şeridi", "Aksiyon"],
      ["code_tap", "Kod Tıklama", "Bulmaca"],
      ["hyper_dodge", "Hiper Kaçış", "Refleks"],
      ["star_miner", "Yıldız Madenci", "Arcade"],
      ["drone_strike", "Dron Saldırısı", "Aksiyon"],
      ["shift_puzzle", "Kaydırmalı Bulmaca", "Bulmaca"],
      ["beat_reflex", "Ritim Refleksi", "Refleks"],
      ["void_drift", "Boşluk Sürüşü", "Arcade"],
      ["turret_def", "Kule Savunması", "Aksiyon"],
      ["pair_blitz", "Hızlı Kart", "Bulmaca"]
    ];

    EXTRA_TITLES.forEach(([id, name, cat]) => GAMES.push({ id, name, cat }));

    const STORAGE_KEY = "trretro_highscores_v1";
    const NAME_KEY = "trretro_playername_v1";

    let coins = 3;
    let soundOn = true;
    let crtOn = true;
    let activeCategory = "Tümü";
    let searchQuery = "";
    let activeGame = GAMES[0];
    let score = 0;
    let gameOver = false;
    let toastTimer = null;

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let audioCtx = null;
    function playSound(type) {
      if (!soundOn) return;
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        const freqs = { select: 520, coin: 880, point: 660, hit: 170 };
        osc.type = type === "hit" ? "sawtooth" : "square";
        osc.frequency.setValueAtTime(freqs[type] || 440, now);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.13);
      } catch (e) {}
    }

    function showToast(title, msg) {
      const box = document.getElementById("retroToast");
      document.getElementById("toastTitle").textContent = title;
      document.getElementById("toastMessage").textContent = msg;
      box.classList.add("toast-visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => box.classList.remove("toast-visible"), 2400);
    }

    function getPlayerName() {
      try {
        const val = localStorage.getItem(NAME_KEY);
        return (val && val.trim()) ? val.trim().toUpperCase() : "MUHSIN";
      } catch (e) {
        return "MUHSIN";
      }
    }

    function savePlayerName() {
      const input = document.getElementById("playerNameInput");
      const clean = ((input && input.value) || "MUHSIN").trim().toUpperCase().slice(0, 12) || "MUHSIN";
      try { localStorage.setItem(NAME_KEY, clean); } catch (e) {}
      if (input) input.value = clean;
      playSound("select");
      showToast("RUMUZ KAYDEDİLDİ", "Aktif oyuncu: " + clean);
    }

    function loadAllScores() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveScore(gameId, pts) {
      if (!pts || pts <= 0) return;
      const all = loadAllScores();
      const list = Array.isArray(all[gameId]) ? all[gameId] : [];
      list.push({ name: getPlayerName(), score: Math.floor(pts) });
      list.sort((a, b) => b.score - a.score);
      all[gameId] = list.slice(0, 5);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(all)); } catch (e) {}
      renderLeaderboard();
      updateHud();
    }

    function resetScores() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      playSound("hit");
      renderLeaderboard();
      updateHud();
      showToast("REKORLAR SIFIRLANDI", "Skor listesi temizlendi.");
    }

    function renderLeaderboard() {
      const listEl = document.getElementById("leaderboardList");
      const all = loadAllScores();
      const entries = Array.isArray(all[activeGame.id]) ? all[activeGame.id] : [];
      if (!entries.length) {
        listEl.innerHTML = "<li><span>Henüz rekor yok</span><strong>0</strong></li>";
        return;
      }
      listEl.innerHTML = entries
        .map((item, idx) => `<li><span>#${idx + 1} ${item.name}</span><strong>${item.score}</strong></li>`)
        .join("");
    }

    function updateHud() {
      document.getElementById("activeGameTitle").textContent = activeGame.name;
      document.getElementById("scoreVal").textContent = Math.floor(score);
      const all = loadAllScores();
      const best = (all[activeGame.id] && all[activeGame.id][0] && all[activeGame.id][0].score) || 0;
      document.getElementById("bestVal").textContent = Math.max(best, Math.floor(score));
      document.getElementById("coinCount").textContent = coins;
    }

    // Mini-game states
    let snake = [];
    let snakeDir = { x: 1, y: 0 };
    let food = { x: 15, y: 10 };

    let xoxBoard = Array(9).fill("");
    let xoxTurn = "X";
    let xoxVsCpu = true;

    let memCards = [];
    let memFlipped = [];
    let memMatched = [];

    let pongY = 200;
    let aiY = 200;
    let ball = { x: 320, y: 240, vx: 4, vy: 3 };

    let dodgeX = 320;
    let meteors = [];

    let targetBox = { x: 260, y: 180, size: 70 };

    function initCurrentGame() {
      score = 0;
      gameOver = false;
      const extraBtn = document.getElementById("extraModeBtn");
      extraBtn.style.display = activeGame.id === "xox" ? "inline-block" : "none";
      if (activeGame.id === "xox") {
        extraBtn.textContent = xoxVsCpu ? "Mod: 1P vs CPU" : "Mod: 2 Kişilik";
      }

      if (activeGame.id === "snake") {
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        snakeDir = { x: 1, y: 0 };
        food = { x: 20, y: 10 };
      } else if (activeGame.id === "xox") {
        xoxBoard = Array(9).fill("");
        xoxTurn = "X";
      } else if (activeGame.id === "memory") {
        const syms = ["👾", "🕹️", "🚀", "💎", "⭐", "🔥", "👾", "🕹️", "🚀", "💎", "⭐", "🔥"];
        memCards = syms.sort(() => Math.random() - 0.5);
        memFlipped = [];
        memMatched = [];
      } else if (activeGame.id === "pong") {
        pongY = 200;
        aiY = 200;
        ball = { x: 320, y: 240, vx: 4.5, vy: 3.2 };
      } else if (activeGame.id === "dodge") {
        dodgeX = 320;
        meteors = [];
      } else {
        targetBox = { x: 120, y: 120, size: 76 };
      }
      updateHud();
    }

    function finishGame(finalScore) {
      if (gameOver) return;
      gameOver = true;
      playSound("hit");
      saveScore(activeGame.id, finalScore);
      showToast("OYUN BİTTİ", activeGame.name + " skorun: " + Math.floor(finalScore));
    }

    function handleDirection(dir) {
      if (gameOver) return;
      if (activeGame.id === "snake") {
        if (dir === "up" && snakeDir.y !== 1) snakeDir = { x: 0, y: -1 };
        if (dir === "down" && snakeDir.y !== -1) snakeDir = { x: 0, y: 1 };
        if (dir === "left" && snakeDir.x !== 1) snakeDir = { x: -1, y: 0 };
        if (dir === "right" && snakeDir.x !== -1) snakeDir = { x: 1, y: 0 };
      } else if (activeGame.id === "pong") {
        if (dir === "up") pongY = Math.max(10, pongY - 34);
        if (dir === "down") pongY = Math.min(canvas.height - 90, pongY + 34);
      } else if (activeGame.id === "dodge") {
        if (dir === "left") dodgeX = Math.max(24, dodgeX - 36);
        if (dir === "right") dodgeX = Math.min(canvas.width - 24, dodgeX + 36);
      } else {
        const step = 28;
        if (dir === "up") targetBox.y = Math.max(20, targetBox.y - step);
        if (dir === "down") targetBox.y = Math.min(canvas.height - targetBox.size - 20, targetBox.y + step);
        if (dir === "left") targetBox.x = Math.max(20, targetBox.x - step);
        if (dir === "right") targetBox.x = Math.min(canvas.width - targetBox.size - 20, targetBox.x + step);
      }
    }

    function checkXoxWinner(b) {
      const lines = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      for (const [a, c, d] of lines) {
        if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
      }
      return b.every(Boolean) ? "DRAW" : null;
    }

    function handleAction() {
      if (gameOver) {
        initCurrentGame();
        return;
      }
      if (activeGame.id === "xox") {
        const emptyIdx = xoxBoard.findIndex((v) => !v);
        if (emptyIdx === -1) return;
        xoxBoard[emptyIdx] = xoxTurn;
        playSound("point");
        const win = checkXoxWinner(xoxBoard);
        if (win === "X") {
          score += 100;
          saveScore("xox", score);
          showToast("KAZANDIN", "X hattı tamamlandı!");
          xoxBoard = Array(9).fill("");
        } else if (win === "O") {
          showToast("O KAZANDI", "Yeni el başlıyor.");
          xoxBoard = Array(9).fill("");
        } else if (win === "DRAW") {
          xoxBoard = Array(9).fill("");
        } else {
          xoxTurn = xoxTurn === "X" ? "O" : "X";
          if (xoxVsCpu && xoxTurn === "O") {
            const cpuIdx = xoxBoard.findIndex((v) => !v);
            if (cpuIdx !== -1) {
              xoxBoard[cpuIdx] = "O";
              xoxTurn = "X";
            }
          }
        }
        updateHud();
      } else if (activeGame.id === "memory") {
        const nextIdx = memCards.findIndex((_, i) => !memFlipped.includes(i) && !memMatched.includes(i));
        if (nextIdx === -1) {
          memMatched = [];
          memFlipped = [];
          return;
        }
        memFlipped.push(nextIdx);
        playSound("point");
        if (memFlipped.length === 2) {
          const [a, b] = memFlipped;
          if (memCards[a] === memCards[b]) {
            memMatched.push(a, b);
            score += 50;
            if (memMatched.length === memCards.length) {
              saveScore("memory", score + 100);
              showToast("TEBRİKLER", "Tüm kartlar eşleşti!");
              memMatched = [];
            }
          }
          memFlipped = [];
        }
        updateHud();
      } else {
        score += 10;
        playSound("point");
        targetBox.x = 40 + Math.floor(Math.random() * (canvas.width - 140));
        targetBox.y = 60 + Math.floor(Math.random() * (canvas.height - 140));
        updateHud();
      }
    }

    let tickCount = 0;
    function stepSimulation() {
      if (gameOver) return;
      tickCount++;

      if (activeGame.id === "snake") {
        if (tickCount % 8 === 0) {
          const head = { x: snake[0].x + snakeDir.x, y: snake[0].y + snakeDir.y };
          const cols = Math.floor(canvas.width / 20);
          const rows = Math.floor(canvas.height / 20);
          if (head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows) {
            finishGame(score);
            return;
          }
          snake.unshift(head);
          if (head.x === food.x && head.y === food.y) {
            score += 15;
            playSound("point");
            food = {
              x: Math.floor(Math.random() * cols),
              y: Math.floor(Math.random() * rows)
            };
            updateHud();
          } else {
            snake.pop();
          }
        }
      } else if (activeGame.id === "pong") {
        ball.x += ball.vx;
        ball.y += ball.vy;
        if (ball.y < 10 || ball.y > canvas.height - 10) ball.vy *= -1;
        aiY += (ball.y - (aiY + 40)) * 0.06;
        if (ball.x < 36 && ball.y > pongY && ball.y < pongY + 80) {
          ball.vx = Math.abs(ball.vx) + 0.15;
          score += 10;
          playSound("point");
          updateHud();
        }
        if (ball.x > canvas.width - 36 && ball.y > aiY && ball.y < aiY + 80) {
          ball.vx = -Math.abs(ball.vx);
        }
        if (ball.x < 0 || ball.x > canvas.width) {
          finishGame(score);
        }
      } else if (activeGame.id === "dodge") {
        if (tickCount % 26 === 0) {
          meteors.push({ x: 30 + Math.random() * (canvas.width - 60), y: -15, r: 14 });
        }
        for (let i = meteors.length - 1; i >= 0; i--) {
          meteors[i].y += 4.2;
          const dx = meteors[i].x - dodgeX;
          const dy = meteors[i].y - (canvas.height - 42);
          if (Math.hypot(dx, dy) < meteors[i].r + 16) {
            finishGame(score);
            return;
          }
          if (meteors[i].y > canvas.height + 20) {
            meteors.splice(i, 1);
            score += 5;
            updateHud();
          }
        }
      }
    }

    function renderFrame() {
      ctx.fillStyle = "#060914";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(0, 245, 212, 0.06)";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 32) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 32) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      if (activeGame.id === "snake") {
        ctx.fillStyle = "#ff2a85";
        ctx.fillRect(food.x * 20 + 2, food.y * 20 + 2, 16, 16);
        snake.forEach((seg, idx) => {
          ctx.fillStyle = idx === 0 ? "#00f5d4" : "#38bdf8";
          ctx.fillRect(seg.x * 20 + 1, seg.y * 20 + 1, 18, 18);
        });
      } else if (activeGame.id === "xox") {
        const startX = 170, startY = 90, cell = 100;
        ctx.strokeStyle = "#00f5d4";
        ctx.lineWidth = 3;
        for (let i = 0; i < 9; i++) {
          const r = Math.floor(i / 3), c = i % 3;
          ctx.strokeRect(startX + c * cell, startY + r * cell, cell, cell);
          if (xoxBoard[i]) {
            ctx.fillStyle = xoxBoard[i] === "X" ? "#ff2a85" : "#ffd166";
            ctx.font = "bold 44px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(xoxBoard[i], startX + c * cell + cell / 2, startY + r * cell + cell / 2);
          }
        }
        ctx.textAlign = "start";
      } else if (activeGame.id === "memory") {
        const startX = 140, startY = 80, w = 84, h = 84, gap = 12;
        memCards.forEach((sym, i) => {
          const r = Math.floor(i / 4), c = i % 4;
          const x = startX + c * (w + gap), y = startY + r * (h + gap);
          const open = memMatched.includes(i) || memFlipped.includes(i);
          ctx.fillStyle = open ? "#1e293b" : "#9b5de5";
          ctx.fillRect(x, y, w, h);
          if (open) {
            ctx.font = "34px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(sym, x + w / 2, y + h / 2);
            ctx.textAlign = "start";
          }
        });
      } else if (activeGame.id === "pong") {
        ctx.fillStyle = "#00f5d4";
        ctx.fillRect(20, pongY, 12, 80);
        ctx.fillStyle = "#ff2a85";
        ctx.fillRect(canvas.width - 32, aiY, 12, 80);
        ctx.fillStyle = "#ffd166";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, 9, 0, Math.PI * 2);
        ctx.fill();
      } else if (activeGame.id === "dodge") {
        ctx.fillStyle = "#00f5d4";
        ctx.fillRect(dodgeX - 18, canvas.height - 54, 36, 24);
        ctx.fillStyle = "#ff2a85";
        meteors.forEach((m) => {
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          ctx.fill();
        });
      } else {
        ctx.fillStyle = "rgba(0, 245, 212, 0.18)";
        ctx.strokeStyle = "#00f5d4";
        ctx.lineWidth = 2;
        ctx.fillRect(targetBox.x, targetBox.y, targetBox.size, targetBox.size);
        ctx.strokeRect(targetBox.x, targetBox.y, targetBox.size, targetBox.size);
        ctx.fillStyle = "#eef2ff";
        ctx.font = "bold 15px sans-serif";
        ctx.fillText(activeGame.name, 20, 32);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "13px sans-serif";
        ctx.fillText("Aksiyon / Boşluk ile puan topla veya yön tuşlarıyla hedefi hareket ettir!", 20, 54);
      }

      if (gameOver) {
        ctx.fillStyle = "rgba(5, 7, 15, 0.78)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff2a85";
        ctx.font = "bold 32px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 12);
        ctx.fillStyle = "#eef2ff";
        ctx.font = "16px sans-serif";
        ctx.fillText("Yeniden başlamak için Başlat veya Boşluk'a bas", canvas.width / 2, canvas.height / 2 + 24);
        ctx.textAlign = "start";
      }
    }

    function renderCatalog() {
      const grid = document.getElementById("gameGrid");
      const filtered = GAMES.filter((g) => {
        const catOk = activeCategory === "Tümü" || g.cat === activeCategory;
        const qOk = !searchQuery || g.name.toLowerCase().includes(searchQuery.toLowerCase()) || g.cat.toLowerCase().includes(searchQuery.toLowerCase());
        return catOk && qOk;
      });
      grid.innerHTML = filtered
        .map((g, idx) => `
          <button type="button" class="game-item ${g.id === activeGame.id ? "active" : ""}" data-id="${g.id}">
            <span class="game-num">#${String(idx + 1).padStart(2, "0")}</span>
            <span class="game-name">${g.name}</span>
            <span class="game-cat">${g.cat}</span>
          </button>
        `)
        .join("");
    }

    function selectGame(gameId) {
      const found = GAMES.find((g) => g.id === gameId);
      if (!found) return;
      activeGame = found;
      playSound("select");
      renderCatalog();
      renderLeaderboard();
      initCurrentGame();
      showToast("OYUN YÜKLENDİ", activeGame.name);
    }

    document.getElementById("coinBtn").addEventListener("click", () => {
      coins++;
      playSound("coin");
      updateHud();
      showToast("JETON EKLENDİ", "Toplam jeton: " + coins);
    });

    document.getElementById("crtBtn").addEventListener("click", (e) => {
      crtOn = !crtOn;
      document.getElementById("crtBox").classList.toggle("crt-enabled", crtOn);
      e.currentTarget.textContent = crtOn ? "📺 CRT: AÇIK" : "📺 CRT: KAPALI";
      playSound("select");
    });

    document.getElementById("soundBtn").addEventListener("click", (e) => {
      soundOn = !soundOn;
      e.currentTarget.textContent = soundOn ? "🔊 Ses: AÇIK" : "🔇 Ses: KAPALI";
    });

    document.getElementById("startBtn").addEventListener("click", () => {
      playSound("select");
      initCurrentGame();
      showToast("BAŞLADI", activeGame.name + " hazır!");
    });

    document.getElementById("actionBtn").addEventListener("click", handleAction);

    document.getElementById("extraModeBtn").addEventListener("click", (e) => {
      if (activeGame.id === "xox") {
        xoxVsCpu = !xoxVsCpu;
        e.currentTarget.textContent = xoxVsCpu ? "Mod: 1P vs CPU" : "Mod: 2 Kişilik";
        initCurrentGame();
        showToast("XOX MODU", xoxVsCpu ? "Yapay zekaya karşı" : "2 Kişilik mod");
      }
    });

    document.querySelectorAll(".dpad button[data-dir]").forEach((btn) => {
      btn.addEventListener("click", () => handleDirection(btn.dataset.dir));
    });

    document.getElementById("saveNameBtn").addEventListener("click", savePlayerName);
    document.getElementById("resetScoresBtn").addEventListener("click", resetScores);

    document.getElementById("categoryFilters").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-cat]");
      if (!btn) return;
      activeCategory = btn.dataset.cat;
      document.querySelectorAll("#categoryFilters button").forEach((b) => b.classList.remove("btn-cyan"));
      btn.classList.add("btn-cyan");
      renderCatalog();
    });

    document.getElementById("gameSearch").addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
      renderCatalog();
    });

    document.getElementById("gameGrid").addEventListener("click", (e) => {
      const item = e.target.closest(".game-item[data-id]");
      if (!item) return;
      selectGame(item.dataset.id);
      document.getElementById("oyun-kabini").scrollIntoView({ behavior: "smooth", block: "start" });
    });

    window.addEventListener("keydown", (e) => {
      if (document.activeElement && document.activeElement.tagName === "INPUT") return;
      const key = e.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
        e.preventDefault();
      }
      if (key === "arrowup" || key === "w") handleDirection("up");
      else if (key === "arrowdown" || key === "s") handleDirection("down");
      else if (key === "arrowleft" || key === "a") handleDirection("left");
      else if (key === "arrowright" || key === "d") handleDirection("right");
      else if (key === " ") handleAction();
    });

    document.getElementById("playerNameInput").value = getPlayerName();
    renderCatalog();
    renderLeaderboard();
    initCurrentGame();

    setInterval(() => {
      stepSimulation();
      renderFrame();
    }, 1000 / 60);
  </script>
</body>
</html>
